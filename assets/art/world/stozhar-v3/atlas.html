    <script>
      const places = JSON.parse(document.getElementById('place-data').textContent).places;
      const byName = new Map(places.map((p) => [p.name, p]));
      const kinds = {
        city: 'Города',
        village: 'Деревни',
        war: 'Следы войны',
        nature: 'Природа',
        road: 'Дороги',
        work: 'Хозяйство',
      };
      const symbols = { city: '■', village: '●', war: '✕', nature: '◆', road: '◇', work: '▲' };
      const colors = {
        city: '#dac9a0',
        village: '#c0b69c',
        war: '#d59c72',
        nature: '#a6b68b',
        road: '#dbcbaa',
        work: '#c0b2a3',
      };
      const svg = document.getElementById('map');
      const list = document.getElementById('list');
      const nodes = new Map();
      const region = document.getElementById('region');
      const kind = document.getElementById('kind');
      const search = document.getElementById('search');
      let zoom = 1,
        centreX = 800,
        centreY = 500,
        selected = null,
        drag = null;
      const ns = 'http://www.w3.org/2000/svg';
      function makeSvg(tag, attrs) {
        const node = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        return node;
      }
      for (const name of [...new Set(places.map((p) => p.region))])
        region.add(new Option(name, name));
      for (const [key, name] of Object.entries(kinds)) kind.add(new Option(name, key));
      for (const p of places) {
        const group = makeSvg('g', {
          class: 'poi',
          tabindex: '0',
          role: 'button',
          'aria-label': p.name,
        });
        const inner = makeSvg('g', {});
        const dot = makeSvg('circle', {
          r: 7,
          fill: '#28251ded',
          stroke: colors[p.kind],
          'stroke-width': 1.5,
          class: 'symbol',
        });
        const glyph = makeSvg('text', {
          'text-anchor': 'middle',
          y: 4,
          'font-size': 11,
          fill: colors[p.kind],
        });
        glyph.textContent = symbols[p.kind];
        const label = makeSvg('g', { class: 'label' });
        label.append(
          makeSvg('rect', {
            x: 11,
            y: -10,
            width: p.name.length * 7.5 + 10,
            height: 20,
            rx: 2,
            fill: '#d6c8a8ef',
            stroke: '#493d2a',
            'stroke-width': 0.5,
          }),
        );
        const text = makeSvg('text', { x: 16, y: 4, 'font-size': 12, fill: '#241f17' });
        text.textContent = p.name;
        label.append(text);
        inner.append(dot, glyph, label);
        group.append(inner);
        document.getElementById('points').append(group);
        group.addEventListener('pointerdown', (e) => e.stopPropagation());
        group.addEventListener('click', () => select(p));
        group.addEventListener('mouseenter', () => {
          label.style.display = '';
        });
        group.addEventListener('mouseleave', draw);
        group.addEventListener('focus', () => {
          label.style.display = '';
        });
        group.addEventListener('blur', draw);
        group.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            select(p);
          }
        });
        const button = document.createElement('button');
        const title = document.createElement('span');
        title.textContent = p.name;
        const small = document.createElement('small');
        small.textContent = `${p.region} · ${kinds[p.kind]}`;
        button.append(title, small);
        button.addEventListener('click', () => select(p));
        list.append(button);
        nodes.set(p.id, { group, inner, label, dot, button });
      }
      function matches(p) {
        return (
          (!region.value || p.region === region.value) &&
          (!kind.value || p.kind === kind.value) &&
          p.name.toLocaleLowerCase('ru').includes(search.value.toLocaleLowerCase('ru'))
        );
      }
      function filter() {
        let count = 0;
        for (const p of places) {
          const visible = matches(p);
          const n = nodes.get(p.id);
          n.group.style.display = visible ? '' : 'none';
          n.button.hidden = !visible;
          if (visible) count++;
        }
        document.getElementById('count').textContent = `${count} мест на карте · всего 128`;
      }
      function draw() {
        const w = 1600 / zoom,
          h = 1000 / zoom;
        centreX = Math.max(w / 2, Math.min(1600 - w / 2, centreX));
        centreY = Math.max(h / 2, Math.min(1000 - h / 2, centreY));
        svg.setAttribute('viewBox', `${centreX - w / 2} ${centreY - h / 2} ${w} ${h}`);
        document.getElementById('zoom').textContent = `${zoom.toFixed(1)}×`;
        const scale =
          Math.max(1600 / Math.max(svg.clientWidth, 1), 1000 / Math.max(svg.clientHeight, 1)) /
          zoom;
        for (const p of places) {
          const n = nodes.get(p.id);
          n.group.setAttribute('transform', `translate(${p.x * 16} ${p.y * 10})`);
          n.inner.setAttribute('transform', `scale(${scale})`);
          n.label.style.display =
            (zoom >= 3 && p.kind === 'city') || selected === p.id ? '' : 'none';
          n.dot.setAttribute('stroke-width', selected === p.id ? 3 : 1.5);
          n.button.classList.toggle('selected', selected === p.id);
        }
      }
      function select(p) {
        if (!matches(p)) {
          region.value = '';
          kind.value = '';
          search.value = '';
          filter();
        }
        selected = p.id;
        zoom = Math.max(zoom, 3);
        centreX = p.x * 16;
        centreY = p.y * 10;
        document.getElementById('name').textContent = p.name;
        document.getElementById('meta').textContent =
          `${p.region} · ${kinds[p.kind]} · предложение`;
        document.getElementById('hook').textContent = p.hook;
        const links = document.getElementById('links');
        links.replaceChildren();
        for (const name of p.linkedTo) {
          const button = document.createElement('button');
          button.textContent = name;
          button.addEventListener('click', () => select(byName.get(name)));
          links.append(button);
        }
        draw();
      }
      function changeZoom(factor) {
        zoom = Math.max(1, Math.min(10, zoom * factor));
        draw();
      }
      document.getElementById('plus').addEventListener('click', () => changeZoom(1.5));
      document.getElementById('minus').addEventListener('click', () => changeZoom(1 / 1.5));
      document.getElementById('fit').addEventListener('click', () => {
        zoom = 1;
        centreX = 800;
        centreY = 500;
        draw();
      });
      svg.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          changeZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2);
        },
        { passive: false },
      );
      svg.addEventListener('pointerdown', (e) => {
        drag = { x: e.clientX, y: e.clientY, cx: centreX, cy: centreY };
        svg.setPointerCapture(e.pointerId);
      });
      svg.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const scale = Math.max(1600 / svg.clientWidth, 1000 / svg.clientHeight) / zoom;
        centreX = drag.cx - (e.clientX - drag.x) * scale;
        centreY = drag.cy - (e.clientY - drag.y) * scale;
        draw();
      });
      svg.addEventListener('pointerup', () => {
        drag = null;
      });
      svg.addEventListener('pointercancel', () => {
        drag = null;
      });
      for (const control of [region, kind, search]) control.addEventListener('input', filter);
      window.addEventListener('resize', draw);
      filter();
      draw();
    </script>
  </body>
</html>
