id: implicit-locale-compare
language: TypeScript
severity: warning
message: localeCompare without a locale orders by the host's default locale and ICU data.
note: |
  AGENTS.md "Tests are executable specifications": determinism/replay. Server,
  browser and replay hosts can order the same ids differently (under `et`,
  'unit-z' sorts before 'unit-t'). Compare code units instead:
  `left < right ? -1 : left > right ? 1 : 0`. Changing an existing combat or
  replay order needs the compatibility analysis AGENTS.md requires.
files:
  - packages/game-core/src/**
  - packages/protocol/src/**
  - apps/server/src/**
ignores:
  - '**/*.test.ts'
rule:
  pattern: $LEFT.localeCompare($RIGHT)
