id: no-domain-module-mocks
language: Tsx
severity: error
message: Mock only external boundaries, not workspace or local modules.
note: AGENTS.md "Test doubles are for external boundaries, not for reimplementing the domain."
files:
  - '**/*.test.ts'
  - '**/*.test.tsx'
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: ^vi\.(mock|doMock)$
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: string
          regex: ^['"](@warwrit/|\.)
