name: Bug
about: Report a reproducible defect
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the observed defect and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit / build SHA
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, replay ID, trace, screenshots, or failing test. Remove secrets and personal data.
