name: Refresh ESLint v10

on:
  push:
    branches: [feat/wp-00-engineering-foundation]
    paths:
      - .github/workflows/refresh-eslint-v10.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/wp-00-engineering-foundation

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Upgrade supported lint toolchain
        run: pnpm add --save-dev --workspace-root eslint@10.9.1 @eslint/js@10.0.1

      - name: Normalize and verify clean checkout contract
        run: |
          pnpm format:write
          ./scripts/bootstrap.sh

      - name: Commit verified dependency graph
        run: |
          rm .github/workflows/refresh-eslint-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore(toolchain): upgrade to ESLint 10'
          git push origin HEAD:feat/wp-00-engineering-foundation
