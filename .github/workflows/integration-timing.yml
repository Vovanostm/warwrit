name: Integration timing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: integration-timing
  cancel-in-progress: false
jobs:
  measure:
    name: Measure integration command
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Measure matched integration commands
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_JOB_NAME: Measure integration command
        run: ./scripts/measure-integration-timing.sh
      - name: Remove owned sample resources
        if: always()
        run: ./scripts/measure-integration-timing.sh cleanup-owned
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-timing-results
          if-no-files-found: warn
          retention-days: 14
