name: Materialize WP-01

on:
  push:
    branches: [feat/wp-01-deterministic-combat-kernel]
    paths:
      - .github/workflows/materialize-wp01.yml
      - .wp01-bootstrap/materialize.py

concurrency:
  group: materialize-wp01-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/wp-01-deterministic-combat-kernel

      - name: Materialize verified source payload
        run: python3 .wp01-bootstrap/materialize.py

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Resolve the updated development dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Normalize repository formatting
        run: pnpm format:write

      - name: Verify the clean-checkout contract
        run: ./scripts/bootstrap.sh

      - name: Assert delivery shape
        run: |
          test -f pnpm-lock.yaml
          test ! -e .wp01-bootstrap
          test ! -e .github/workflows/materialize-wp01.yml
          git diff --check

      - name: Commit verified WP-01 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(core): implement deterministic combat kernel'
          git push origin HEAD:feat/wp-01-deterministic-combat-kernel
