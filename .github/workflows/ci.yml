name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_COLOR: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Reject edits to released migrations
        if: github.event_name == 'pull_request'
        env:
          MIGRATIONS_BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-migrations.mjs

      - name: Bootstrap and verify
        run: ./scripts/bootstrap.sh

      - name: Measure unit-test coverage for the audit
        if: github.event_name == 'pull_request'
        run: pnpm test:coverage --maxWorkers=2

      - name: Reject quality regressions in changed files
        if: github.event_name == 'pull_request'
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
        run: pnpm check:changes
