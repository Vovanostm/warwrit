name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_COLOR: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Apply and format WP-02.4 source normalization
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/wp-02-inventory-care'
        run: |
          node scripts/wp024-normalize.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/game-core/src/company/physical-items.ts')
          s = p.read_text()
          s = s.replace("export function returnCompanyItemsForDeparture(\n  root: MaterializedCompanyState,\n  characterId: string,\n  returnContainerId: string,\n  sourceId: string,\n  context: EconomyContext,", "export function returnCompanyItemsForDeparture(\n  root: MaterializedCompanyState,\n  characterId: string,\n  returnContainerId: string,\n  sourceId: string,\n  _context: EconomyContext,")
          p.write_text(s)
          p = Path('packages/game-core/src/company/physical-outcomes.ts')
          s = p.read_text()
          for name in ['  activeConditions,\n', '  physicalId,\n', '  replaceContainer,\n']:
              s = s.replace(name, '')
          s = s.replace("  let lifecycle = movePresence(root.lifecycle, p.characterId, availability, fact.location);", "  const lifecycle = movePresence(root.lifecycle, p.characterId, availability, fact.location);")
          p.write_text(s)
          p = Path('packages/testkit/src/company-physical.spec.test.ts')
          s = p.read_text()
          s = s.replace("  currentCondition = PHYSICAL_RULES.defaultConditionMaximum,\n  maximumCondition = PHYSICAL_RULES.defaultConditionMaximum,", "  currentCondition: number = PHYSICAL_RULES.defaultConditionMaximum,\n  maximumCondition: number = PHYSICAL_RULES.defaultConditionMaximum,")
          s = s.replace("  PHYSICAL_RULES,\n  canonicalJson,", "  PHYSICAL_RULES,\n  canonicalJson,\n  entityId,")
          s = s.replace("encounterBindingId: 'encounter'", "encounterBindingId: entityId('encounter')")
          s = s.replace("      physical: undefined,\n", "")
          p.write_text(s)
          PY
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .

      - name: Bootstrap and verify
        run: ./scripts/bootstrap.sh

      - name: Commit normalized WP-02.4 sources and restore CI
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/wp-02-inventory-care'
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm scripts/wp024-normalize.mjs
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wp-02.4): normalize physical domain sources"
          git push origin HEAD:${{ github.head_ref }}
