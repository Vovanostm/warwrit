name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_COLOR: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Apply WP-02.4 source normalization
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/wp-02-inventory-care'
        run: node scripts/wp024-normalize.mjs

      - name: Bootstrap and verify
        run: ./scripts/bootstrap.sh

      - name: Commit normalized WP-02.4 sources and restore CI
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/wp-02-inventory-care'
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm scripts/wp024-normalize.mjs
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wp-02.4): normalize physical domain sources"
          git push origin HEAD:${{ github.head_ref }}
