name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_COLOR: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Show canonical Prettier diff
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier packages/game-core/src/company/social.ts packages/testkit/src/company-social.spec.test.ts --write
          git diff -- packages/game-core/src/company/social.ts packages/testkit/src/company-social.spec.test.ts
          exit 1
