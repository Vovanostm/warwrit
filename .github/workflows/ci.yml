name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify clean checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FORCE_COLOR: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check current plan before expensive verification
        run: bash scripts/check-current-plan.sh

      - name: Select verification scope
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          route="$(bash scripts/orca-validate.sh . "origin/$GITHUB_BASE_REF" --plan)"
          printf '%s\n' "$route"
          if [[ "$route" == 'ROUTE docs' ]]; then
            echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Check agent harness regressions
        run: |
          node --test scripts/git-hooks/check-hooks.mjs
          bash scripts/tests/agent-workflow-fixtures.sh

      - name: Reject edits to released migrations
        if: github.event_name == 'pull_request'
        env:
          MIGRATIONS_BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-migrations.mjs

      - name: Validate documentation-only changes
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          bash scripts/orca-validate.sh . "$base"

      - name: Bootstrap and verify
        if: steps.scope.outputs.docs_only != 'true'
        env:
          WARWRIT_INTEGRATION_COVERAGE: ${{ github.event_name == 'pull_request' && 'output/world-lab-ci/sql' || '' }}
          WARWRIT_MIGRATION_RUNTIME_COVERAGE: ${{ github.event_name == 'pull_request' && 'output/world-lab-ci/migration.json' || '' }}
        run: |
          mkdir -p output/world-lab-ci
          ./scripts/bootstrap.sh

      - name: Measure unit-test coverage for the audit
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        run: pnpm test:coverage --maxWorkers=1

      - name: Install pinned browser
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Measure real world-map journeys
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        run: bash scripts/world-map/check-world-lab-ci.sh

      - name: Measure ordinary painted-map journey
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        run: bash scripts/world-map/check-painted-game-ci.sh

      - name: Reject quality regressions in changed files
        id: quality_audit
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        env:
          FALLOW_AUDIT_BASE: origin/${{ github.base_ref }}
          QUALITY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p output/quality-audit
          {
            printf 'checkout=%s\n' "$(git rev-parse HEAD)"
            printf 'audit_base_ref=%s\n' "$FALLOW_AUDIT_BASE"
            printf 'audit_base_commit=%s\n' "$(git rev-parse "$FALLOW_AUDIT_BASE")"
            printf 'pr_head=%s\n' "$QUALITY_PR_HEAD_SHA"
            printf 'run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '%s\n' 'command=pnpm check:changes --format json --output-file output/quality-audit/audit.json'
          } > output/quality-audit/context.txt
          audit_status=0
          pnpm check:changes --format json --output-file output/quality-audit/audit.json \
            2> output/quality-audit/audit.stderr || audit_status=$?
          cat output/quality-audit/audit.stderr >&2
          printf 'exit=%s\n' "$audit_status" >> output/quality-audit/context.txt
          exit "$audit_status"

      - name: Explain introduced quality findings
        if: always() && (steps.quality_audit.outcome == 'success' || steps.quality_audit.outcome == 'failure')
        run: node scripts/print-quality-audit.mjs output/quality-audit/audit.json

      - name: Keep quality audit diagnostics
        if: always() && (steps.quality_audit.outcome == 'success' || steps.quality_audit.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/quality-audit/audit.json
            output/quality-audit/audit.stderr
            output/quality-audit/context.txt
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

      - name: Keep playable-map previews
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playable-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/painted-game-ci/*/journey.json
            output/painted-game-ci/*/painted-map*.png
            output/world-lab-ci/runtime-*/*map.png
            output/world-lab-ci/runtime-*/journey.json
            output/world-lab-ci/runtime-*/failure-ui.json
            output/world-lab-ci/runtime-*/map-recovery-*.json
            output/world-lab-ci/runtime-*/stop-traffic.json
            output/world-lab-ci/runtime-*/pursuit-stop-responses.json
            output/world-lab-ci/runtime-*/pursuit-start-response.json
          if-no-files-found: ignore
          retention-days: 7
