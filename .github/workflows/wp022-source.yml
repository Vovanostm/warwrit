name: Materialize world consistency corrections
on:
  push:
    branches: [workbench/wp022-source]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a81260f62d020e1ca8e78098d846d0416941e6ab
          persist-credentials: false
      - name: Verify transport, patch and tree; create commit without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, http.client, json, os, pathlib, subprocess, time, urllib.request, urllib.error
          base = 'a81260f62d020e1ca8e78098d846d0416941e6ab'
          expected_tree = 'b8f8c6faf8c2483a8df3fcec0f948a1ff0d94cb2'
          parts = ['ac3c817c93bbe3349b7420dc7886ac4bf0903bc5', '389d1888a53ddba05574627708c00495ecaccf9f', '32b693c05c7f96dda5874e8bd5eeaf6ff6d06a40', 'cb71b73a2450667244eec6b06e76c3c075707ce7']
          files = {
              'AGENTS.md': '5a1229f9a17f36448da5dc60c41e412d29e1de38',
              'docs/work-packages/WP-02.2-WORLD-REVIEW.md': '15c22552344703c2ba5f7c713e444b978503a90c',
              'docs/work-packages/WP-02.2.md': '7248dc7e62a30b6b088c9f7d62d3dd8c6801bfd2',
              'packages/game-core/src/company/lifecycle-state.ts': '140766e9c74d77933d2cd76cdbe81479d273bf90',
              'packages/game-core/src/company/membership.ts': '2406855d86f13c3ec36278a70c3267fb9d64c97e',
              'packages/game-core/src/company/opening.ts': 'ac06a5983d69f8e98f03ae4383fc56c9362e8ac4',
              'packages/testkit/src/company-lifecycle.spec.test.ts': 'a31c97540c80e14c7c4a8be267f14ac88b0f548a',
          }
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(4):
                  req = urllib.request.Request('https://api.github.com/repos/Vovanostm/warwrit' + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (500, 502, 503, 504) or attempt == 3:
                          raise
                  except (urllib.error.URLError, http.client.RemoteDisconnected):
                      if attempt == 3:
                          raise
                  time.sleep(attempt + 1)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == base
          chunks = []
          for sha in parts:
              raw = base64.b64decode(api('/git/blobs/' + sha)['content'])
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              chunks.append(raw)
          encoded = b''.join(chunks)
          assert len(encoded) == 10608
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 21236
          assert hashlib.sha256(raw).hexdigest() == 'e89f865a19ea4e47a7cb5b269cb051e231d24973b9152373b9669aba09538454'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'world-review.patch'
          patch.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(files)
          assert git('write-tree') == expected_tree
          entries = []
          for path, sha in files.items():
              assert git('hash-object', path) == sha
              blob = api('/git/blobs', {'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(), 'encoding': 'base64'})
              assert blob['sha'] == sha
              print('VERIFIED_BLOB=' + path + ':' + sha, flush=True)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          base_tree = api('/git/commits/' + base)['tree']['sha']
          tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})
          assert tree['sha'] == expected_tree
          commit = api('/git/commits', {'message': 'fix(domain): enforce capable care handover and owned world evidence', 'tree': tree['sha'], 'parents': [base]})
          print('REVIEWED_COMMIT=' + commit['sha'])
          print('VERIFIED_TREE=' + expected_tree)
          print('No branch ref, merge or deployment changed by this job.')
          PY
