name: Export WP022 source
on:
  push:
    branches: [workbench/wp022-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: dc1b8e97bc3dacd804811e6351804f5e4c66ec1e
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr12-review-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr12-review-source
          path: ${{ runner.temp }}/pr12-review-source.tar.gz
          retention-days: 2
