name: WP021 offline workbench
on:
  push:
    branches: [feat/wp-02-domain-foundation]
permissions:
  contents: read
jobs:
  bundle:
    if: startsWith(github.event.head_commit.message, 'chore(workbench)')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dcba9c38
        with:
          node-version-file: .node-version
      - name: Build offline workbench without credentials or Git metadata
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/workbench/repo" "$RUNNER_TEMP/workbench/bin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/workbench/repo"
          cp -a node_modules "$RUNNER_TEMP/workbench/repo/"
          for p in apps/* packages/*; do
            if [ -d "$p/node_modules" ]; then cp -a "$p/node_modules" "$RUNNER_TEMP/workbench/repo/$p/"; fi
          done
          cp "$(command -v node)" "$RUNNER_TEMP/workbench/bin/node"
          git rev-parse HEAD > "$RUNNER_TEMP/workbench/SOURCE_SHA"
          tar -C "$RUNNER_TEMP/workbench" -czf "$RUNNER_TEMP/warwrit-workbench.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp021-offline-workbench
          path: ${{ runner.temp }}/warwrit-workbench.tar.gz
          retention-days: 1
          compression-level: 0
