name: A03 format helper
on: workflow_dispatch
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/testkit/src/company-practice-credit.spec.test.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: a03-formatted-test
          path: packages/testkit/src/company-practice-credit.spec.test.ts
