name: A03 format helper

on:
  push:
    branches:
      - tmp/a03-format-helper

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/testkit/src/company-practice-credit.spec.test.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: a03-formatted-test
          path: packages/testkit/src/company-practice-credit.spec.test.ts
