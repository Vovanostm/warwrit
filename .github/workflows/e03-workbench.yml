name: E04b read-only source export
on:
  push:
    branches: [workbench/e03-offline-20260913]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cf47b68ff851bbc85a4f687874011fe2493e344b
          persist-credentials: false
      - name: Export tracked source only, without credentials or Git config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e04b-source
          git archive HEAD | gzip > /tmp/e04b-source/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/e04b-source/source-identity.txt
          (cd /tmp/e04b-source && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e04b-source-cf47b68
          path: /tmp/e04b-source/
          retention-days: 1
