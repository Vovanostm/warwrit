name: Materialize WP-00

on:
  push:
    branches: [feat/wp-00-engineering-foundation]

concurrency:
  group: materialize-wp00-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: warwrit
          POSTGRES_PASSWORD: warwrit
          POSTGRES_USER: warwrit
        options: >-
          --health-cmd "pg_isready -U warwrit -d warwrit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://warwrit:warwrit@localhost:5432/warwrit
      FORCE_COLOR: '1'
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feat/wp-00-engineering-foundation

      - name: Materialize repository source
        run: python3 .bootstrap/materialize.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Resolve and lock dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Normalize formatting
        run: pnpm format:write

      - name: Verify repository
        run: pnpm verify

      - name: Exercise migration up/down
        run: pnpm test:migrations

      - name: Assert delivery shape
        run: |
          test -f pnpm-lock.yaml
          test ! -e .bootstrap
          test ! -e .github/workflows/scaffold-wp00.yml
          git diff --check

      - name: Commit verified foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/ci.yml
          git add --all
          git commit -m 'chore(repo): establish WP-00 engineering foundation'
          git push origin HEAD:feat/wp-00-engineering-foundation
