name: PR scope

# Advisory size report and required task linkage; semantic review owns cohesion.
# Preserve the existing job identity for consumers and branch protection.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: pr-scope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: One issue per pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check size and linked issues
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          bash scripts/check-pr-scope.sh "origin/${{ github.base_ref }}" "$RUNNER_TEMP/pr-body.md"

      - name: Keep the CURRENT_PLAN status block readable
        if: ${{ !cancelled() }}
        run: bash scripts/check-current-plan.sh
