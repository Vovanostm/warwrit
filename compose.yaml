services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warwrit
      POSTGRES_PASSWORD: warwrit
      POSTGRES_USER: warwrit
    healthcheck:
      test: [CMD-SHELL, pg_isready -U warwrit -d warwrit]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - warwrit-postgres:/var/lib/postgresql/data

  dex:
    image: ghcr.io/dexidp/dex@sha256:bc7cfce7c17f52864e2bb2a4dc1d2f86a41e3019f6d42e81d92a301fad0c8a1d
    command: ['dex', 'serve', '/etc/dex/config.yaml']
    ports:
      - '127.0.0.1:5556:5556'
    volumes:
      - ./fixtures/identity/dex.dev.yaml:/etc/dex/config.yaml:ro
      - warwrit-dex:/var/dex

volumes:
  warwrit-postgres:
  warwrit-dex:
