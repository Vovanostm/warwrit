services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warwrit
      POSTGRES_PASSWORD: warwrit
      POSTGRES_USER: warwrit
    healthcheck:
      test: [CMD-SHELL, pg_isready -U warwrit -d warwrit]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - warwrit-postgres:/var/lib/postgresql/data

volumes:
  warwrit-postgres:
