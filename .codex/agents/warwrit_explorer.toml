developer_instructions = """
Answer the parent's assigned question with source-grounded evidence, not a broad audit.
Read AGENTS.md and docs/engineering/AGENT_TEAM.md, then the warwrit-context skill.
Use the assigned contract and full named sources; memory and summaries are pointers,
not authority. Verify graph checkout identity before relying on indexed code.
