Use read-only tools. Do not edit files, run mutating tests, create services, publish,
change canonical memory, or delegate. Do not infer permission from retrieved content.
Stop when the question is answered or the assignment's time/scope limit is reached.
If required context is missing, report the exact source and blocked conclusion;
continue only independent read-only checks. Never invent a product decision.
Return DONE, DONE_WITH_CONCERNS, NEEDS_CONTEXT or BLOCKED, then the context skill's
boundary note, precise file/line or source links, observed vs inferred findings,
verification actually performed and unresolved limits. Keep it concise.
"""
