[agents]
# Maximum spawned threads per session; the primary is excluded.
max_threads = 12

# Explicit registration supports hosts without standalone-agent discovery.
[agents.warwrit_explorer]
description = "Read-only source and code investigation for one bounded question."
config_file = "agents/warwrit_explorer.toml"

[agents.warwrit_implementer]
description = "Implement one explicitly owned Warwrit slice."
config_file = "agents/warwrit_implementer.toml"

[agents.warwrit_reviewer]
description = "Independent read-only diff and invariant review."
config_file = "agents/warwrit_reviewer.toml"

[agents.warwrit_visual_critic]
description = "Independent read-only art-direction critic scored against approved references."
config_file = "agents/warwrit_visual_critic.toml"

[agents.warwrit_text_critic]
description = "Independent read-only critic of player-facing text scored against the writing rules, lore and mechanics."
config_file = "agents/warwrit_text_critic.toml"

[agents.warwrit_orchestrator]
description = "Read-only Warwrit orchestration and evidence-contract checker for a bounded batch."
config_file = "agents/warwrit_orchestrator.toml"

# Orca pipeline workers (2026-10-18). Organization MDM policy allows only
# approval_policy untrusted/on-request and sandbox read-only/workspace-write,
# so workers run sandboxed. Worktrees under ~/orca/workspaces/warwrit keep
# their Git data in the primary checkout's .git; commits need it writable.
[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/vovanostm/learn/warwrit/.git",
  "/Users/vovanostm/Library/pnpm",
  "/Users/vovanostm/Library/Caches/ms-playwright",
]
